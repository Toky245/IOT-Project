<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Tracker - IOT</title>

  <!-- Google Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- App CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <span class="material-symbols-outlined logo-icon">my_location</span>
      <h1>GPS Tracker</h1>
      <span class="badge">LIVE</span>
    </div>
    <div class="header-right">
      <button id="btn-help" class="icon-btn" title="Guide d'utilisation">
        <span class="material-symbols-outlined">help_outline</span>
      </button>
      <button id="btn-theme" class="icon-btn" title="Changer le theme">
        <span class="material-symbols-outlined" id="theme-icon">light_mode</span>
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside id="sidebar">

    <!-- Statut -->
    <div class="panel">
      <div class="panel-header">
        <span class="material-symbols-outlined panel-icon">cell_tower</span>
        <h3>Statut</h3>
      </div>
      <div class="stat">
        <label>Connexion</label>
        <div class="stat-right">
          <span id="status" class="status-offline">Deconnecte</span>
          <div id="signal" class="signal-bar">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
      <div class="stat">
        <label>Derniere MAJ</label>
        <span id="last-update">--</span>
      </div>
    </div>

    <!-- Position -->
    <div class="panel">
      <div class="panel-header">
        <span class="material-symbols-outlined panel-icon">location_on</span>
        <h3>Position</h3>
      </div>
      <div class="stat">
        <label>Latitude</label>
        <span id="current-lat" class="coord-value">--</span>
      </div>
      <div class="stat">
        <label>Longitude</label>
        <span id="current-lng" class="coord-value">--</span>
      </div>
      <div class="stat">
        <label>Altitude</label>
        <span id="current-alt">-- m</span>
      </div>
    </div>

    <!-- Vitesse -->
    <div class="panel">
      <div class="panel-header">
        <span class="material-symbols-outlined panel-icon">speed</span>
        <h3>Vitesse</h3>
      </div>
      <div class="speed-display">
        <span id="current-speed" class="speed-number">--</span>
        <span class="speed-unit">km/h</span>
      </div>
    </div>

    <!-- Statistiques -->
    <div class="panel">
      <div class="panel-header">
        <span class="material-symbols-outlined panel-icon">bar_chart</span>
        <h3>Statistiques</h3>
      </div>
      <div class="stat">
        <label>Points GPS</label>
        <span id="total-points">0</span>
      </div>
      <div class="stat">
        <label>Distance</label>
        <span id="total-distance">0 m</span>
      </div>
    </div>

    <!-- Geofencing -->
    <div class="panel">
      <div class="panel-header">
        <span class="material-symbols-outlined panel-icon">fence</span>
        <h3>Geofencing</h3>
      </div>
      <div class="stat">
        <label>Zones actives</label>
        <span id="geofence-count">0</span>
      </div>
      <div class="panel-actions">
        <button class="panel-btn" id="btn-add-zone">
          <span class="material-symbols-outlined">add_circle</span>
          Ajouter zone
        </button>
        <button class="panel-btn panel-btn-danger" id="btn-clear-zones">
          <span class="material-symbols-outlined">delete_sweep</span>
          Supprimer tout
        </button>
      </div>
      <div id="geofence-alert" class="alert-box" style="display:none">
        <span class="material-symbols-outlined">warning</span>
        <span>Tracker hors zone !</span>
      </div>
    </div>

    <!-- Exporter -->
    <div class="panel">
      <div class="panel-header">
        <span class="material-symbols-outlined panel-icon">download</span>
        <h3>Exporter</h3>
      </div>
      <div class="panel-actions">
        <button class="panel-btn" id="btn-export-csv">
          <span class="material-symbols-outlined">table_chart</span>
          CSV
        </button>
        <button class="panel-btn" id="btn-export-json">
          <span class="material-symbols-outlined">data_object</span>
          JSON
        </button>
      </div>
    </div>

    <!-- Historique -->
    <div class="panel" id="history-panel">
      <div class="panel-header">
        <span class="material-symbols-outlined panel-icon">history</span>
        <h3>Historique</h3>
        <button class="history-expand-btn" id="btn-history-expand" title="Voir tout l'historique">
          <span class="material-symbols-outlined">visibility</span>
        </button>
      </div>
      <div id="history-list"></div>
    </div>

  </aside>

  <!-- Carte -->
  <div id="map">

    <!-- Controles carte -->
    <div class="map-controls">
      <button class="map-btn" id="btn-center">
        <span class="material-symbols-outlined">gps_fixed</span>
        <span class="map-btn-label">Centrer</span>
      </button>
      <button class="map-btn" id="btn-trail">
        <span class="material-symbols-outlined">route</span>
        <span class="map-btn-label">Trajet</span>
      </button>
      <button class="map-btn" id="btn-geofence">
        <span class="material-symbols-outlined">fence</span>
        <span class="map-btn-label">Zone</span>
      </button>
      <button class="map-btn" id="btn-clear">
        <span class="material-symbols-outlined">delete</span>
        <span class="map-btn-label">Effacer</span>
      </button>
      <div class="map-controls-divider"></div>
      <button class="map-btn" id="btn-telegram-map">
        <svg class="telegram-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
        </svg>
        <span class="map-btn-label">Telegram</span>
      </button>
    </div>

    <!-- Selecteur de couche -->
    <div class="layer-switcher">
      <button class="layer-toggle-btn" id="layer-toggle">
        <span class="material-symbols-outlined">layers</span>
      </button>
      <div class="layer-menu" id="layer-menu">
        <div class="layer-menu-title">Couches de carte</div>
        <button class="layer-option active" data-layer="Standard">
          <span class="material-symbols-outlined layer-opt-icon">map</span>
          <span>Standard</span>
        </button>
        <button class="layer-option" data-layer="Satellite">
          <span class="material-symbols-outlined layer-opt-icon">satellite_alt</span>
          <span>Satellite</span>
        </button>
        <button class="layer-option" data-layer="Topographique">
          <span class="material-symbols-outlined layer-opt-icon">terrain</span>
          <span>Topographique</span>
        </button>
        <button class="layer-option" data-layer="Sombre">
          <span class="material-symbols-outlined layer-opt-icon">dark_mode</span>
          <span>Sombre</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Barre de statut -->
  <div id="status-bar">
    <div class="status-bar-left">
      <div id="status-bar-dot" class="status-bar-dot"></div>
      <span id="status-bar-text">En attente de signal GPS...</span>
    </div>
    <div class="status-bar-right">
      <span id="status-bar-coords">--</span>
      <span id="status-bar-points">0 pts</span>
    </div>
  </div>

  <!-- Mobile bottom nav -->
  <nav id="mobile-nav">
    <button class="mobile-nav-btn" data-tab="sidebar">
      <span class="material-symbols-outlined">dashboard</span>
      <span>Infos</span>
    </button>
    <button class="mobile-nav-btn active" data-tab="map">
      <span class="material-symbols-outlined">map</span>
      <span>Carte</span>
    </button>
    <button class="mobile-nav-btn" data-tab="history">
      <span class="material-symbols-outlined">history</span>
      <span>Historique</span>
    </button>
  </nav>

  <!-- Notifications -->
  <div id="toast-container"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App JS -->
  <script src="js/utils.js"></script>
  <script src="js/map.js"></script>
  <script src="js/geofence.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/websocket.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
